<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MoonChat</title>

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0b141a;
color:white;
display:flex;
height:100vh;
}

.sidebar{
width:30%;
background:#202c33;
overflow:auto;
}

.search{
padding:10px;
}

.search input{
width:100%;
padding:8px;
border:none;
border-radius:6px;
}

.contact{
display:flex;
align-items:center;
padding:10px;
cursor:pointer;
border-bottom:1px solid #2a3942;
}

.contact:hover{
background:#2a3942;
}

.avatar{
width:40px;
height:40px;
border-radius:50%;
margin-right:10px;
}

.contact-info{
flex:1;
}

.contact-name{
font-weight:bold;
}

.contact-last{
font-size:12px;
color:#aaa;
}

.chat{
flex:1;
display:flex;
flex-direction:column;
}

.header{
background:#202c33;
padding:10px;
display:flex;
align-items:center;
justify-content:space-between;
}

.header-left{
display:flex;
align-items:center;
}

.header img{
width:40px;
height:40px;
border-radius:50%;
margin-right:10px;
}

.status{
font-size:12px;
color:#aaa;
}

.header-right button{
margin-left:10px;
background:none;
border:none;
color:white;
font-size:18px;
cursor:pointer;
}

.messages{
flex:1;
padding:10px;
overflow:auto;
background:#111b21;
}

.message{
max-width:60%;
padding:10px;
margin:5px;
border-radius:10px;
}

.left{
background:#202c33;
}

.right{
background:#005c4b;
margin-left:auto;
}

.input-area{
display:flex;
padding:10px;
background:#202c33;
}

input{
flex:1;
padding:10px;
border:none;
border-radius:6px;
}

button{
margin-left:10px;
padding:10px;
border:none;
border-radius:6px;
background:#00a884;
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<div class="sidebar">

<div class="search">
<input placeholder="🔍 Cari chat...">
</div>

<div id="contacts">

<div class="contact" onclick="openChat('user1')">

<img class="avatar" src="https://i.pravatar.cc/40?img=1">

<div class="contact-info">

<div class="contact-name">User +251234</div>

<div class="contact-last">Last seen 5 menit lalu</div>

</div>

</div>

<div class="contact" onclick="openChat('user2')">

<img class="avatar" src="https://i.pravatar.cc/40?img=2">

<div class="contact-info">

<div class="contact-name">User +251111</div>

<div class="contact-last">Online</div>

</div>

</div>

</div>

</div>

<div class="chat">

<div class="header">

<div class="header-left">

<img src="https://i.pravatar.cc/40?img=1">

<div>

<div id="chatName">User</div>

<div class="status" id="status">online</div>

</div>

</div>

<div class="header-right">

<button>📞</button>

<button>🎥</button>

</div>

</div>

<div class="messages" id="messages"></div>

<div class="input-area">

<input id="msg" placeholder="Ketik pesan 😊">

<button onclick="send()">Kirim</button>

</div>

</div>

<script>

const socket = io()

let currentChat=""

function openChat(user){

currentChat=user

document.getElementById("chatName").innerText=user

}

function send(){

const text=document.getElementById("msg").value

if(!text)return

socket.emit("chat",{to:currentChat,msg:text})

addMessage(text,"right")

document.getElementById("msg").value=""

}

function addMessage(text,side){

const div=document.createElement("div")

div.className="message "+side

div.innerText=text

document.getElementById("messages").appendChild(div)

}

socket.on("chat",(data)=>{

addMessage(data.msg,"left")

})

</script>

</body>
</html>
