<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MoonChat</title>

<link rel="stylesheet" href="style.css">

<style>

.container{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
}

.logo{
font-size:40px;
margin-bottom:20px;
}

button{
width:200px;
font-size:16px;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
🌙 MoonChat
</div>

<p>
Chat seperti WhatsApp tapi dengan nomor +25
</p>

<button onclick="start()">Mulai</button>

</div>

<script>

function start(){

const user = localStorage.getItem("moon_user")

if(user){

location="chat.html"

}else{

location="register.html"

}

}

</script>

</body>
</html>
